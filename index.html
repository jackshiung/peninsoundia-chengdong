<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6b7ebd">
<meta name="color-scheme" content="light">
<title>共聲島｜展覽論述</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* RWD（以手機為主）：以 375 寬的版型為基準，只依螢幕寬度等比縮放；
       平板、電腦最寬放大到 430px 寬的手機尺寸，置中顯示 */
    --u:min(calc(100vw / 375), max(.8px, calc((100vh - env(safe-area-inset-top) - calc(env(safe-area-inset-bottom) * 2.4)) / 598.4)), 1.1467px);
    --green:#c2da69;
    --white:#ffffff;
    --bg-top:#6b7ebd;
    --ink-soft:rgba(255,255,255,.78);
  }
  @supports (height:100dvh){
    :root{--u:min(calc(100vw / 375), max(.8px, calc((100dvh - env(safe-area-inset-top) - calc(env(safe-area-inset-bottom) * 2.4)) / 598.4)), 1.1467px)}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* 背景：漸層畫在 body 上，body 最少撐滿整個螢幕高 (100lvh)。
     iPhone Safari（iOS 26）會把網址列後方當成網頁以外的區域，用 html 底色填 → html 底色＝漸層底色；
     頂端狀態列則取 body 底色 → body 底色＝漸層頂色。
     另外上下邊緣各放一條固定色條（.edge），Safari 會參考它來染狀態列／網址列 */
  html{background:#5877ba;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%} /* 鎖住縮放：不允許雙指縮放、連點放大 */
  .edge{position:fixed;left:0;right:0;z-index:0;pointer-events:none}
  .edge-top{top:0;height:env(safe-area-inset-top);background:#6b7ebd}
  .edge-bottom{bottom:0;height:calc(env(safe-area-inset-bottom) * 2.4);background:#5877ba}
  @media (min-width:600px){.edge-bottom{height:env(safe-area-inset-bottom)}}
  body{
    font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
    color:var(--white);
    background:linear-gradient(180deg,#6b7ebd 0%,#7281be 25%,#8288c1 50%,#8c8ec5 68%,#7a84c0 76%,#657cbc 83%,#5877ba 90%,#5877ba 100%) no-repeat #6b7ebd; /* 底色＝漸層頂色：Safari 會拿它填頂端狀態列 */
    background-size:100% 100%;
    min-height:100vh;min-height:100lvh;
    overscroll-behavior:none;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  main{
    position:relative;
    max-width:calc(375 * var(--u));margin:0 auto;
    /* 高度＝瀏覽器實際可見高度（扣掉 Safari／Chrome／LINE 的網址列、工具列）；
       元件大小固定，只有元件之間的間距會依可見高度伸縮，所以一屏放得下、不被裁切 */
    height:100vh;height:100dvh;
    min-height:calc(598.4 * var(--u) + env(safe-area-inset-top) + calc(env(safe-area-inset-bottom) * 2.4));
    padding:env(safe-area-inset-top) calc(24 * var(--u)) 0;
    display:flex;flex-direction:column;align-items:center;
  }

  .logo{width:64.7%;display:block}

  /* 耳機提示 */
  .phones{
    position:relative;
    display:flex;align-items:center;gap:calc(7.2 * var(--u));
    padding:calc(4.8 * var(--u)) calc(11 * var(--u)) calc(4.8 * var(--u)) calc(6.3 * var(--u));
    border-radius:999px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(194,218,105,.35);
    font-size:calc(9.7 * var(--u));font-weight:500;letter-spacing:.075em;line-height:1;
    color:var(--white);
  }
  /* 發光層：固定的光暈，只改透明度 → 亮暗過渡平滑沒有斷點 */
  .phones::before{
    content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
    border:1px solid rgba(194,218,105,.95);
    box-shadow:0 0 calc(10 * var(--u)) rgba(194,218,105,.5), 0 0 calc(21 * var(--u)) rgba(194,218,105,.22), inset 0 0 calc(7 * var(--u)) rgba(194,218,105,.16);
    opacity:0;
    animation:breathe 2.2s cubic-bezier(.45,0,.55,1) infinite alternate;
  }
  @keyframes breathe{ from{opacity:0} to{opacity:1} }
  .phones svg{
    width:calc(18 * var(--u));height:calc(18 * var(--u));color:var(--green);
    filter:drop-shadow(0 0 calc(4 * var(--u)) rgba(194,218,105,.9));
    animation:breatheIcon 2.2s cubic-bezier(.45,0,.55,1) infinite alternate;
  }
  @keyframes breatheIcon{ from{opacity:.6} to{opacity:1} }

  /* 風車 */
  .stage{
    position:relative;
    width:calc(292.5 * var(--u));
    aspect-ratio:1;
    cursor:pointer;
    border:0;background:none;
    touch-action:manipulation;
  }
  .stick{
    position:absolute;left:50%;top:calc(50% + calc(14.75 * var(--u)));
    width:calc(5 * var(--u));height:50%;
    transform:translateX(-50%);
    background:#5c6eab;
    border:1.2px solid #fff;
    border-top:0;
    -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);
            mask-image:linear-gradient(180deg,#000 55%,transparent);
  }
  .pinwheel{
    position:absolute;inset:0;width:100%;height:100%;
    will-change:transform;
  }
  .ring{
    position:absolute;left:50%;top:50%;
    width:70%;aspect-ratio:1;
    border:1.5px solid rgba(194,218,105,.8);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(.6);
    opacity:0;pointer-events:none;
  }
  .playing .ring{animation:ripple 3.6s ease-out infinite}
  .playing .ring:nth-child(2){animation-delay:1.2s}
  .playing .ring:nth-child(3){animation-delay:2.4s}
  @keyframes ripple{
    0%{transform:translate(-50%,-50%) scale(.55);opacity:.7}
    100%{transform:translate(-50%,-50%) scale(1.55);opacity:0}
  }
  /* 點擊提示：風車正中心一個會按壓的光點＋兩圈漣漪（D 觸控光點），第一次播放後消失 */
  .tap-dot,.tap-ripple{position:absolute;pointer-events:none;z-index:2;border-radius:50%;
    left:50%;top:50%} /* 對準風車中心（圓孔＝旋轉中心＝框的正中央） */
  .tap-dot{
    width:calc(27 * var(--u));height:calc(27 * var(--u));margin:calc(-13.5 * var(--u)) 0 0 calc(-13.5 * var(--u));
    background:#fff;
    box-shadow:0 0 calc(19 * var(--u)) rgba(255,255,255,.9),0 0 calc(35 * var(--u)) rgba(194,218,105,.8);
    animation:tapDot 2s ease-in-out infinite;
  }
  .tap-ripple{
    width:calc(43 * var(--u));height:calc(43 * var(--u));margin:calc(-21.5 * var(--u)) 0 0 calc(-21.5 * var(--u));
    border:2px solid rgba(194,218,105,.95);opacity:0;
    animation:tapRipple 2s ease-out infinite;
  }
  .tap-ripple.r2{animation-delay:.35s}
  @keyframes tapDot{0%,100%{transform:scale(1);opacity:.9}35%{transform:scale(.7);opacity:1}}
  @keyframes tapRipple{0%,30%{opacity:0;transform:scale(.4)}35%{opacity:.95;transform:scale(.5)}85%,100%{opacity:0;transform:scale(2)}}
  .tap-dot,.tap-ripple{transition:opacity .4s}
  .started .tap-dot,.started .tap-ripple{animation:none;opacity:0}
  .tap-hint{
    font-size:calc(13.62 * var(--u));letter-spacing:.2em;color:var(--ink-soft);
    transition:opacity .4s;
  }

  h1{
    font-size:calc(26.71 * var(--u));font-weight:900;letter-spacing:.06em;
    color:var(--green);text-align:center;line-height:1.3;
  }
  /* 標點擠壓：逗號佔半格，字形置中在半格裡（繁中字型的逗號畫在字框正中） */
  h1 .comma{display:inline-block;width:.5em;white-space:nowrap;text-indent:-.25em;overflow:visible}

  /* 播放控制 */
  /* 播放器：沒有播放鍵，播放／暫停都靠點風車；時間軸左右留白相同、置中，方便拖曳回放 */
  .player{
    width:100%;
    padding:0 calc(12.2 * var(--u));
    display:flex;align-items:flex-start;
  }
  .track{flex:1;min-width:0;margin-top:calc(5.4 * var(--u))}
  .bar{
    position:relative;height:calc(22 * var(--u));cursor:pointer;touch-action:none;
  }
  .bar::before,.fill{
    content:"";position:absolute;left:0;top:50%;height:calc(4 * var(--u));margin-top:calc(-2 * var(--u));border-radius:calc(4 * var(--u));
  }
  .bar::before{right:0;background:rgba(255,255,255,.28)}
  .fill{background:var(--green);width:0}
  .knob{
    position:absolute;top:50%;left:0;width:calc(14 * var(--u));height:calc(14 * var(--u));margin:calc(-7 * var(--u)) 0 0 calc(-7 * var(--u));
    border-radius:50%;background:#fff;box-shadow:0 1px calc(6 * var(--u)) rgba(0,0,0,.25);
  }
  .times{margin-top:calc(-.2 * var(--u));display:flex;justify-content:space-between;font-size:calc(12 * var(--u));color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.04em}

  footer{
    font-size:calc(9.5 * var(--u));letter-spacing:.06em;color:rgba(255,255,255,.6);text-align:center;
  }

  /* 間距：依 375×812 版型的原始間距；畫面不夠高時按比例縮，但不小於最小值。
     g6（播放器到頁尾）最先縮，畫面比版型高時多出來的空間也放這裡 */
  .logo,.phones,.stage,h1,.tap-hint,.player,footer{flex-shrink:0}
  .gap{display:block;width:100%;flex:0 1 auto}
  .g0{flex:1.6 1 calc(70 * var(--u));min-height:calc(28 * var(--u))} /* 上方留白：比下方多，整組內容略往下（使用者要求往下移） */
  .g1{flex-basis:calc(34 * var(--u));min-height:calc(12 * var(--u))}
  .g2{flex-basis:calc(7.7 * var(--u));min-height:0}
  .g3{flex-basis:calc(28.3 * var(--u));min-height:calc(10 * var(--u))}
  .g4{flex-basis:calc(11.3 * var(--u));min-height:calc(6 * var(--u))}
  .g5{flex-basis:calc(40.2 * var(--u));min-height:calc(16 * var(--u))}
  .g6{flex:0 1 calc(91.4 * var(--u));min-height:calc(16 * var(--u))} /* 播放器到頁尾（依 SVG 91.4） */
  .g7{flex:1 1 calc(26.7 * var(--u));min-height:calc(8 * var(--u))} /* 下方留白 */
  /* 底部預留：只有 iPhone Safari（iOS 26）網址列浮在網頁上，會蓋住最下方。
     這種情況 safe-area-inset-bottom 約 34px → 預留約 82px；Chrome、LINE、Android 為 0，不預留 */
  .g8{flex:0 0 auto;height:calc(env(safe-area-inset-bottom) * 2.4)}
  @media (min-width:600px){.g8{height:0}} /* 平板、電腦沒有浮動網址列，不預留 */
  @media (prefers-reduced-motion:reduce){
    .phones::before,.phones svg{animation:none}
    .playing .ring{animation:none}
    .tap-dot,.tap-ripple{animation:none}
  }
</style>
</head>
<body>
<span class="edge edge-top" aria-hidden="true"></span>
<span class="edge edge-bottom" aria-hidden="true"></span>
<main id="app">
  <span class="gap g0" aria-hidden="true"></span>
  <img class="logo" src="assets/logo.svg" alt="共聲島 PeninSOUNDla">

  <span class="gap g1" aria-hidden="true"></span>
  <div class="phones" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 14v-2a9 9 0 0 1 18 0v2"/>
      <path d="M3 14h3a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2z"/>
      <path d="M21 14h-3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h1a2 2 0 0 0 2-2z"/>
    </svg>
    建議配戴耳機聆聽
  </div>

  <span class="gap g2" aria-hidden="true"></span>
  <button class="stage" id="stage" aria-label="點擊風車播放／暫停">
    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
    <span class="stick"></span>
    <img class="pinwheel" id="pinwheel" src="assets/pinwheel.svg" alt="">
    <span class="tap-ripple" aria-hidden="true"></span>
    <span class="tap-ripple r2" aria-hidden="true"></span>
    <span class="tap-dot" aria-hidden="true"></span>
  </button>
  <span class="gap g3" aria-hidden="true"></span>
  <h1>跟著風聲<span class="comma">，</span>聽見共聲島</h1>
  <span class="gap g4" aria-hidden="true"></span>
  <p class="tap-hint">輕觸風車　開始聆聽</p>

  <span class="gap g5" aria-hidden="true"></span>
  <div class="player">
    <div class="track">
      <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">2:47</span></div>
    </div>
  </div>

  <span class="gap g6" aria-hidden="true"></span>
  <footer>sound by PeninSOUNDla</footer>
  <span class="gap g7" aria-hidden="true"></span>
  <span class="gap g8" aria-hidden="true"></span>
</main>

<audio id="audio" src="assets/audio.mp3" preload="metadata"></audio>

<script>
(() => {
  // 鎖住縮放：iPhone Safari 會忽略 user-scalable=no，另外攔下雙指縮放（連點放大由 CSS touch-action 擋）
  const stop = e => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  const app = document.getElementById('app');
  const audio = document.getElementById('audio');
  const wheel = document.getElementById('pinwheel');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const knob = document.getElementById('knob');
  const cur = document.getElementById('cur');
  const dur = document.getElementById('dur');

  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  // 風車：一開始靜止，播放後慢慢轉起來，暫停時慢慢停下
  const IDLE = 0, PLAY = 80; // 度/秒
  let angle = 0, speed = IDLE, target = IDLE, last = performance.now();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    speed += (target - speed) * Math.min(1, dt * 0.9);
    angle = (angle - speed * dt) % 360; // 逆時針，符合葉片方向
    wheel.style.transform = 'rotate(' + angle + 'deg)';
    requestAnimationFrame(tick);
  }
  if (!reduce) requestAnimationFrame(tick);

  function toggle() { audio.paused ? audio.play() : audio.pause(); }
  document.getElementById('stage').addEventListener('click', toggle);

  audio.addEventListener('play', () => { app.classList.add('started', 'playing'); target = PLAY; });
  audio.addEventListener('pause', () => { app.classList.remove('playing'); target = IDLE; });
  audio.addEventListener('ended', () => { audio.currentTime = 0; });
  audio.addEventListener('loadedmetadata', () => { dur.textContent = fmt(audio.duration); });

  let dragging = false;
  function render() {
    const p = audio.duration ? audio.currentTime / audio.duration : 0;
    fill.style.width = (p * 100) + '%';
    knob.style.left = (p * 100) + '%';
    cur.textContent = fmt(audio.currentTime);
  }
  audio.addEventListener('timeupdate', () => { if (!dragging) render(); });

  function seek(e) {
    const r = bar.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    if (audio.duration) { audio.currentTime = p * audio.duration; render(); }
  }
  bar.addEventListener('pointerdown', e => { dragging = true; bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove', e => { if (dragging) seek(e); });
  bar.addEventListener('pointerup', () => { dragging = false; });
  bar.addEventListener('pointercancel', () => { dragging = false; });

  // 鎖定畫面／通知列顯示
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: '展覽論述', artist: '共聲島 PeninSOUNDla', album: '城東大院子' });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  }
})();
</script>
</body>
</html>
